name: Build VaultApp APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # allows manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Android SDK version we want – adjust if you need a different API level
      ANDROID_API_LEVEL: 33
      ANDROID_BUILD_TOOLS: 33.0.2
      JAVA_VERSION: '17'
      GO_VERSION: '1.22'
      ANDROID_HOME: /tmp/android-sdk

    steps:
      # -----------------------------------------------------------------
      # 1��������������������������������������������������������������️��������������������������������������������������������������⃣ Checkout source
      # -----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # 2��������������������������������������������������������������️��������������������������������������������������������������⃣ Set up JDK
      # -----------------------------------------------------------------
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # -----------------------------------------------------------------
      # 3��������������������������������������������������������������⃣ Install Android SDK command line tools
      # -----------------------------------------------------------------
      - name: Install Android SDK command line tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          echo "y" | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --install "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}:$PATH" >> $GITHUB_ENV

      # -----------------------------------------------------------------
      # 4��������������������������������������������������������������⃣ Accept licenses
      # -----------------------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses

      # -----------------------------------------------------------------
      # 5��������������������������������������������������������������⃣ Set up Go
      # -----------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # -----------------------------------------------------------------
      # 6��������������������������������������������������������������⃣ Build Go vault binary for android/arm64
      # -----------------------------------------------------------------
      - name: Build Go binary (android/arm64)
        run: |
          export GOOS=android
          export GOARCH=arm64
          go build -o vaultapp main.go
          chmod +x vaultapp
          mkdir -p android/app/src/main/assets
          cp vaultapp android/app/src/main/assets/

      # -----------------------------------------------------------------
      # 7��������������������������������������������������������������⃣ Prepare a temporary test keystore (used for signing the APK)
      # -----------------------------------------------------------------
      - name: Create test keystore
        run: |
          keytool -genkeypair -v \
            -keystore test-key.jks \
            -alias test-alias \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Test, O=Test, C=US"

      # -----------------------------------------------------------------
      # 8��������������������������������������������������������������⃣ Compile Java sources (including generated R.java)
      # -----------------------------------------------------------------
      - name: Compile Java
        run: |
          # Android platform jar
          PLATFORM_JAR=$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}/android.jar
          # Create directories for generated sources and compiled classes
          mkdir -p android/app/obj android/app/gen
          # Generate R.java from resources
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt package \
            -f -m -J android/app/gen -S android/app/src/main/res -M android/app/src/main/AndroidManifest.xml -I $PLATFORM_JAR
          javac -bootclasspath $PLATFORM_JAR -d android/app/obj \
            $(find android/app/src/main/java -name "*.java") android/app/gen/com/example/myapp/R.java

      # -----------------------------------------------------------------
      # 9��������������������������������������������������������������⃣ Convert .class → .dex
      # -----------------------------------------------------------------
      - name: Dex conversion
        run: |
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/dx --dex --output=classes.dex android/app/obj

      # -----------------------------------------------------------------
      # ���������� �������� �������� ������ �������� ������ ������ ���� �������� ������ ������ ���� ������ ���� ���� �� �������� ������ ������ ���� ������ ���� ���� �� ������ ���� ���� �� ���� �� �� 🔟 Package resources (unsigned APK)
      # -----------------------------------------------------------------
      - name: Package unsigned APK
        run: |
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt package \
            -f -M android/app/src/main/AndroidManifest.xml -S android/app/src/main/res -I $PLATFORM_JAR -F vault-app-unsigned.apk

      # -----------------------------------------------------------------
      # ���������� �������� �������� ������ �������� ������ ������ ���� �������� ������ ������ ���� ������ ���� ���� �� �������� ������ ������ ���� ������ ���� ���� �� ������ ���� ���� �� ���� �� �� 🔠 Add dex and assets to the unsigned APK
      # -----------------------------------------------------------------
      - name: Add dex and assets
        run: |
          mkdir -p tmp
          cp classes.dex tmp/
          cp -r android/app/src/main/assets tmp/assets
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt add vault-app-unsigned.apk tmp/classes.dex
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt add vault-app-unsigned.apk -A tmp/assets

      # -----------------------------------------------------------------
      # ���������� �������� �������� ������ �������� ������ ������ ���� �������� ������ ������ ���� ������ ���� ���� �� �������� ������ ������ ���� ������ ���� ���� �� ������ ���� ���� �� ���� �� �� 🔡 Sign the APK with the test keystore
      # -----------------------------------------------------------------
      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner sign \
            --ks test-key.jks \
            --ks-key-alias test-alias \
            --ks-pass pass:android \
            --key-pass pass:android \
            vault-app-unsigned.apk

      # -----------------------------------------------------------------
      # ���������� �������� �������� ������ �������� ������ ������ ���� �������� ������ ������ ���� ������ ���� ���� �� �������� ������ ������ ���� ������ ���� ���� �� ������ ���� ���� �� ���� �� �� 🔢 Zipalign (optional but recommended)
      # -----------------------------------------------------------------
      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign -p 4 vault-app-unsigned.apk vault-app.apk

      # -----------------------------------------------------------------
      # ���������� �������� �������� ������ �������� ������ ������ ���� �������� ������ ������ ���� ������ ���� ���� �� �������� ������ ������ ���� ������ ���� ���� �� ������ ���� ���� �� ���� �� �� 🔣 Upload the final APK as an artifact
      # -----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-app-apk
          path: vault-app.apk
